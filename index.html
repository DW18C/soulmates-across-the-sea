<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soulmates Across the Sea</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#d9b26b; --ink:#3a2b22; }
  html,body{height:100%;margin:0;font-family:'Georgia','Times New Roman',serif;
    background:radial-gradient(ellipse at center, #2b4a5e 0%, #0f1e2b 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{position:relative;width:min(94vw,1000px);height:min(88vh,760px);perspective:2000px;}
  .page{position:absolute;top:0;left:0;width:100%;height:100%;
    background:#fdf6e9;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;box-sizing:border-box;backface-visibility:hidden;overflow:hidden;
    transform-origin:left center;transition:transform 1s cubic-bezier(.4,.2,.2,1), box-shadow 1s;
    text-align:center;}
  .page img{max-width:100%;max-height:78%;object-fit:contain;border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .page h1{color:var(--ink);font-size:clamp(24px,4vw,40px);margin:6px 0;}
  .page h2{color:#7a6a5a;font-weight:normal;font-style:italic;margin:0 0 10px;}
  .page p.caption{color:var(--ink);margin-top:10px;font-size:clamp(13px,2vw,18px);font-style:italic;flex-shrink:0;}
  .page .num{position:absolute;bottom:8px;right:14px;font-size:12px;color:#a9987f;}
  .page.collage-page{justify-content:flex-start;}
  .page.collage-page .caption{margin-top:8px;flex-shrink:0;}
  .collage-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;
    width:100%;flex-shrink:0;overflow:hidden;}
  .collage-grid img{width:100%;height:100%;object-fit:cover;border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .flipped{transform:rotateY(-180deg);box-shadow:none;}
  .page.note-page{display:block;padding:0;background-size:cover;background-position:center;text-align:left;}
  .note-overlay{position:absolute;inset:0;
    background:linear-gradient(105deg, rgba(6,5,4,.97) 0%, rgba(6,5,4,.93) 45%, rgba(6,5,4,.55) 68%, rgba(6,5,4,.1) 85%);}
  .note-content{position:relative;z-index:1;height:100%;max-width:70%;box-sizing:border-box;
    padding:16px 14px;color:#fbf3e3;overflow-y:auto;}
  .note-series{font-family:'Dancing Script',cursive;font-weight:600;font-size:13px;color:#f0e2c3;margin-bottom:5px;}
  .note-day{font-size:13.5px;font-weight:bold;margin:0 0 2px;}
  .note-date{font-size:9px;color:#dccfb5;margin:0 0 7px;}
  .note-rule{border:none;border-top:1px solid rgba(255,255,255,.35);margin:5px 0 8px;}
  .note-body p{font-size:9.5px;line-height:1.45;margin:0 0 7px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .note-sign{font-family:'Dancing Script',cursive;font-weight:700;font-size:15px;margin-top:3px;color:#f0e2c3;}
  @media (min-width:600px){
    .note-series{font-size:20px;} .note-day{font-size:22px;} .note-date{font-size:13px;}
    .note-body p{font-size:14px;line-height:1.55;margin-bottom:11px;} .note-sign{font-size:22px;}
  }
  .note-page .num{color:#e9dcc3;}
  #controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:50;}
  button{background:var(--gold);border:none;color:#2b2016;padding:10px 20px;border-radius:30px;
    font-size:16px;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.4);}
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:.4;cursor:default;}
  #pageCount{color:#e9dcc3;align-self:center;font-size:14px;}
</style>
</head>
<body>

<audio id="bgMusic" src="song.mp4" preload="auto"></audio>

<div id="stage"></div>

<div id="controls">
  <button id="prevBtn">&larr; Prev</button>
  <span id="pageCount"></span>
  <button id="nextBtn">Next &rarr;</button>
</div>

<script>
const N = "NoteImages/";
const G = "GoofyandLoveImages/";

const pages = [
  {type:'note', img:"6053c3fa-3af5-4063-a30e-82dabf98f15c.png", day:11, date:"September 30, 2026",
    body:[
      "Your daily reminder that you're perfect.",
      "I keep trying to wrap my mind around what you've done to me in such a short amount of time, and I still can't fully explain it. I wasn't looking for this. I wasn't planning on this. And then you showed up, completely unannounced, and my heart just... took over. No warning, no negotiation. It just decided that you're what it wants. You're what it's been waiting for.",
      "Every single day since, you find some new way to remind me exactly why I feel the way I do about you. It's not always something big, sometimes it's just a quiet moment, sometimes it's a whole day, but it's constant. And that's what I want us to be. Constant.",
      "Out of every version of my life I could have ended up living, out of every single server I could have picked the day I started playing this game, I ended up right next to you. Maybe that's luck. Or maybe some things are just meant to find each other no matter how many roads it takes to get there, and that's exactly what happened the day I found you.",
      "So today's note is simple too: you deserve to be loved exactly the way you love, without hesitation, without conditions, completely. I just hope I get to keep being the one who gets to try."
    ],
    sign:"DWC ♡"},
  {type:'cover', img:G+"SoulMate.png", title:"Soulmates Across the Sea", sub:"A David & Charlotte Story"},
  {img:G+"OneDaySheWillBeMine.png", caption:"Before we were anything, I already knew: one day, she'd be mine."},
  {img:G+"GoofyDroolingOverHer.png", caption:"She walks in and I forget what I was saying."},
  {img:G+"Photobooth.png", caption:"Just us, being completely ridiculous together."},
  {img:G+"Dear Davey.png", caption:"The letter that made it all feel real, for both of us."},
  {img:G+"FavoritePicture.png", caption:"My favorite picture, of my favorite person."},
  {img:G+"FromHer.png", caption:"Turns out she'd been falling just as hard, the whole time."},
  {img:G+"HerConfessingFirst.png", caption:"Then one day, before I could say it myself, she said it first."},
  {type:'collage',
    imgs:[N+"Day1.png", N+"Day2.png", N+"Day3.png", N+"Day4.jpg"],
    caption:"Where a promise began: remind her, every single day, that she's perfect."},
  {type:'collage',
    imgs:[N+"Day5.jpg", N+"Day6.png", N+"Day7.png", N+"Day8.png"],
    caption:"Still every day. Never got old."},
  {type:'collage',
    imgs:[N+"Day9Note.png", N+"b3b8b5ac-ae6b-44ca-9a90-f57103ddea1c.png"],
    caption:"Days 9 and 10. Still counting."},
  {img:N+"ImNotGoingAnywhere.png", caption:"Our contract: I'm not going anywhere."},
  {img:N+"TicTacToe.png", caption:"A game I made up, just as an excuse to get her flowers."},
  {img:G+"OurToDoList.png", caption:"Our list for the future. Item one: stay soulmates."},
  {img:G+"HopefullyOurFuture.png", caption:"Hopefully, this is us someday."},
  {img:G+"NoteBookSketch.png", caption:"To be continued..."}
];

const stage = document.getElementById('stage');
let current = 0;

pages.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'page';
  div.style.zIndex = pages.length - i;
  if(p.type === 'cover'){
    div.innerHTML = `<h1>${p.title}</h1><h2>${p.sub}</h2><img src="${p.img}" alt="cover"><p class="caption">Turn the page...</p>`;
  } else if(p.type === 'note'){
    div.classList.add('note-page');
    div.style.backgroundImage = `url('${p.img}')`;
    const bodyHtml = p.body.map(par => `<p>${par}</p>`).join('');
    div.innerHTML = `<div class="note-overlay"></div>
      <div class="note-content">
        <div class="note-series">The Note Series ♡</div>
        <div class="note-day">Day ${p.day} of 365</div>
        <div class="note-date">${p.date}</div>
        <hr class="note-rule">
        <div class="note-body">${bodyHtml}</div>
        <div class="note-sign">${p.sign}</div>
      </div>
      <span class="num">${i+1} / ${pages.length}</span>`;
  } else if(p.type === 'collage'){
    div.classList.add('collage-page');
    const imgsHtml = p.imgs.map((src, idx) => `<img src="${src}" alt="memory ${i}-${idx}">`).join('');
    const rows = Math.ceil(p.imgs.length / 2);
    div.innerHTML = `<div class="collage-grid" style="grid-template-rows:repeat(${rows}, 1fr);">${imgsHtml}</div><p class="caption">${p.caption||''}</p><span class="num">${i+1} / ${pages.length}</span>`;
  } else {
    div.innerHTML = `<img src="${p.img}" alt="memory ${i}"><p class="caption">${p.caption||''}</p><span class="num">${i+1} / ${pages.length}</span>`;
  }
  stage.appendChild(div);
});

const pageEls = document.querySelectorAll('.page');

function sizeCollagePages(){
  document.querySelectorAll('.page.collage-page').forEach(page => {
    const grid = page.querySelector('.collage-grid');
    const caption = page.querySelector('.caption');
    if(!grid || !caption) return;
    grid.style.height = 'auto';
    const style = getComputedStyle(page);
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const captionStyle = getComputedStyle(caption);
    const captionMarginTop = parseFloat(captionStyle.marginTop) || 0;
    const available = page.clientHeight - padTop - padBottom - caption.offsetHeight - captionMarginTop;
    grid.style.height = Math.max(available, 60) + 'px';
  });
}

window.addEventListener('load', sizeCollagePages);
window.addEventListener('resize', sizeCollagePages);
sizeCollagePages();

function update(){
  pageEls.forEach((el, i) => {
    el.classList.toggle('flipped', i < current);
    el.style.zIndex = i < current ? i : pages.length - i;
  });
  document.getElementById('pageCount').textContent = `${current} / ${pages.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === pages.length;
}

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.25; // 0 (silent) to 1 (full volume)

document.getElementById('nextBtn').onclick = () => {
  if(current < pages.length){
    if(current === 0){
      bgMusic.currentTime = 0;
      bgMusic.play();
    }
    current++;
    update();
  }
};
document.getElementById('prevBtn').onclick = () => { if(current > 0){ current--; update(); } };
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});

update();
</script>
</body>
</html>
